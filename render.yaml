# Render Blueprint: creates the web server and its PostgreSQL database.
# In Render: New > Blueprint > pick this repository. Fill in the values marked sync: false.
# Free plans for the team demo. For launch, change both plans to paid ones (e.g. starter / basic-256mb):
# the free web service sleeps after 15 minutes idle, and the free database expires after 30 days.
services:
  - type: web
    name: heatharvest
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: heatharvest-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: TEAM_NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: heatharvest-db
    region: frankfurt
    databaseName: heatharvest
    plan: free
